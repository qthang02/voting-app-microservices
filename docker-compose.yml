# ===========================================
# Voting App Microservice - Docker Compose
# ===========================================
# Usage:
#   docker compose up        - Start all services
#   docker compose up -d     - Start in background
#   docker compose down      - Stop all services
#   docker compose down -v   - Stop and remove volumes
# ===========================================

services:
  # ---- Vote Service (Python/Flask) ----
  vote:
    build:
      context: ./vote
      target: final
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file:
      - .env
    ports:
      - "8080:80"
    networks:
      - front-tier
      - back-tier
    restart: unless-stopped

  # ---- Result Service (Node.js/Express) ----
  result:
    build: ./result
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file:
      - .env
    ports:
      - "8081:80"
    networks:
      - front-tier
      - back-tier
    restart: unless-stopped

  # ---- Worker Service (Go) ----
  worker:
    build: ./worker
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file:
      - .env
    networks:
      - back-tier
    restart: unless-stopped

  # ---- Redis ----
  redis:
    image: redis:alpine
    healthcheck:
      test: /healthchecks/redis.sh
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - "./healthchecks:/healthchecks"
    networks:
      - back-tier
    restart: unless-stopped

  # ---- PostgreSQL ----
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - "db-data:/var/lib/postgresql/data"
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/postgres.sh
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - back-tier
    restart: unless-stopped

volumes:
  db-data:

networks:
  front-tier:
  back-tier:
